[package]
name = "oop-terminal"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "OOP Terminal: a standalone GPU terminal emulator whose first pane runs oop"

[[bin]]
name = "oop-terminal"
path = "src/main.rs"

[workspace]

[dependencies]
alacritty_terminal = "0.26"
winit = "0.30"
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "dx12", "vulkan"] }
cosmic-text = { version = "0.19", default-features = false, features = [
  "std",
  "swash",
  "fontconfig",
] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
arboard = { version = "3", default-features = false }
libc = "0.2"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
