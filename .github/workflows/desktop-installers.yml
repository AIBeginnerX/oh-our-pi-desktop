name: Build public desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable OOP version already tagged on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-desktop-installers-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every later job builds and publishes the tag's commit, not whatever main points at now,
      # so a retry after main has moved still produces and attaches the tagged release.
      - id: release
        name: Bind the build to the release tag
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Version must be X.Y.Z."
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != "refs/tags/v$REQUESTED_VERSION" ]]; then
            fail "Dispatch from main or from the v$REQUESTED_VERSION tag."
          fi
          tag_sha="$(git rev-list -n 1 "v$REQUESTED_VERSION")" || fail "Tag v$REQUESTED_VERSION does not exist."
          git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/main ||
            fail "Tag v$REQUESTED_VERSION is not on main."
          source_version="$(git show "$tag_sha:OOP_RELEASE.json" | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>console.log(JSON.parse(s).version))')"
          [[ "$REQUESTED_VERSION" == "$source_version" ]] ||
            fail "The tagged OOP_RELEASE.json is $source_version, not $REQUESTED_VERSION."
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
            asset: OOP-${{ needs.preflight.outputs.version }}-arm64.dmg
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            asset: OOP-${{ needs.preflight.outputs.version }}-x64.exe
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            asset: OOP-${{ needs.preflight.outputs.version }}-x86_64.AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Install Spectre-mitigated Windows runtime
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          if (-not $installPath) { throw "Visual Studio installation not found." }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "modify", "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "--quiet", "--norestart"
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer failed with exit code $($process.ExitCode)." }

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      # The profile is compiled into the bundle: it names the app OOP, keeps its data in
      # ~/.oop-desktop, and turns on the release-feed updater. Packaging alone is too late.
      - name: Build desktop bundle
        env:
          T3CODE_DESKTOP_BUILD_PROFILE_NAME: oop-desktop
        run: vp run build:desktop

      - name: Package OOP installer
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          T3CODE_DESKTOP_BUILD_PROFILE_NAME: oop-desktop
          # macOS and Windows builds update themselves from this repository's releases.
          OOP_DESKTOP_UPDATE_GITHUB: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts \
            --platform "$PLATFORM" \
            --target "$TARGET" \
            --arch "$ARCH" \
            --build-version "$VERSION" \
            --skip-build \
            --output-dir public-installer \
            --verbose

      - name: Accept only the requested installer
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          test -s "public-installer/$ASSET"
          find public-installer -maxdepth 1 -type f -print

      # The in-app updater reads oop-update-<platform>.json from the newest release and fetches
      # the installer it names (the same file the one-line installer uses) from that version.
      - name: Build the in-app update feed
        if: matrix.platform != 'linux'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync, statSync, writeFileSync } from "node:fs";
            const [version, platform, arch, asset] = process.argv.slice(1);
            const file = `public-installer/${asset}`;
            const feed = {
              schemaVersion: 1,
              platform: platform === "mac" ? "darwin" : "win32",
              arch,
              version,
              pkg: asset,
              size: statSync(file).size,
              sha256: createHash("sha256").update(readFileSync(file)).digest("hex"),
            };
            const name = platform === "mac" ? "macos" : "windows";
            writeFileSync(`public-installer/oop-update-${name}.json`, `${JSON.stringify(feed, null, 2)}\n`);
          ' "$VERSION" "$PLATFORM" "$ARCH" "$ASSET"
          cat public-installer/oop-update-*.json

      # The later jobs read the files at the artifact root. Uploading file paths kept them under
      # public-installer/, so 0.0.111 could not find them; a directory upload roots at that directory.
      - name: Collect the files to hand over
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir handoff
          cp "public-installer/$ASSET" handoff/
          if compgen -G "public-installer/oop-update-*.json" >/dev/null; then
            cp public-installer/oop-update-*.json handoff/
          fi
          ls -l handoff

      - name: Upload installer between jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: handoff/
          if-no-files-found: error
          # Long enough to re-run a failed publish with these exact bytes.
          retention-days: 7

  verify-install:
    name: Install and launch ${{ matrix.label }}
    needs: [preflight, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            arch: arm64
            asset: OOP-${{ needs.preflight.outputs.version }}-arm64.dmg
          - label: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            asset: OOP-${{ needs.preflight.outputs.version }}-x64.exe
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            asset: OOP-${{ needs.preflight.outputs.version }}-x86_64.AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Download the installer built for this release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: verify-input

      - name: Install Linux GUI runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      # Install, launch to readiness, reinstall, launch, and uninstall the exact artifact that the
      # publish job will attach. Nothing is uploaded unless every platform passes.
      - name: Verify install, launch, reinstall, and uninstall
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          ASSET: ${{ matrix.asset }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == linux ]]; then
            xvfb-run -a node scripts/verify-desktop-install.mjs --installer "verify-input/$ASSET" --version "$VERSION"
          else
            node scripts/verify-desktop-install.mjs --installer "verify-input/$ASSET" --version "$VERSION"
          fi

  publish:
    name: Verify and attach all installers
    needs: [preflight, build, verify-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installer-*
          path: release-input
          merge-multiple: true

      - name: Copy and hash the final release assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/prepare-desktop-install-assets.mjs \
            --version "$VERSION" \
            --mac "release-input/OOP-$VERSION-arm64.dmg" \
            --windows "release-input/OOP-$VERSION-x64.exe" \
            --linux "release-input/OOP-$VERSION-x86_64.AppImage" \
            --update-feed release-input/oop-update-macos.json \
            --update-feed release-input/oop-update-windows.json \
            --out release-ready

      # A retry only fills in what is missing: an asset already attached must match these bytes
      # exactly, and one that differs is never replaced.
      - name: Verify release and attach missing assets without overwriting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          [[ "$(git rev-list -n 1 "v$VERSION")" == "$SOURCE_SHA" ]] || {
            echo "Tag v$VERSION moved after the build started; refusing to publish." >&2
            exit 1
          }
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          attached="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          mkdir -p attached-assets
          missing=()
          for file in release-ready/*; do
            name="$(basename "$file")"
            if grep -Fxq -- "$name" <<<"$attached"; then
              gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir attached-assets
              if ! cmp -s "$file" "attached-assets/$name"; then
                echo "$name is already attached with different bytes; refusing to overwrite." >&2
                exit 1
              fi
              echo "$name is already attached with identical bytes."
            else
              missing+=("$file")
            fi
          done
          if ((${#missing[@]} > 0)); then
            gh release upload "v$VERSION" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
          else
            echo "Every asset was already attached."
          fi
